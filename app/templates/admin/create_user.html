{% extends "base.html" %}
{% block title %}Create User | Admin | {{ site_name }}{% endblock %}

{% block content %}
<div class="page-narrow">
  <div class="page-header">
    <h1>Create User</h1>
    <a href="{{ url_for('admin_users') }}" class="btn btn-sm">Back to Users</a>
  </div>

  <div class="card">
    <form method="POST" action="{{ url_for('admin_create_user') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" autofocus required
               maxlength="32" placeholder="letters, digits, _ and -"
               autocomplete="off">
        <span class="form-hint">Letters, digits, underscores, hyphens. Max 32 chars.</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" required
               autocomplete="new-password" placeholder="At least 8 characters">
      </div>

      <div class="form-group">
        <label class="form-label" for="role">Role</label>
        <select id="role" name="role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div style="display:flex;gap:0.5rem;margin-top:1.25rem;">
        <button type="submit" class="btn btn-primary">Create User</button>
        <a href="{{ url_for('admin_users') }}" class="btn">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
