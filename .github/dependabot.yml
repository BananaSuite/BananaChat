version: 2
updates:
  # Weekly update pull requests for the requirements.txt ranges; regenerate requirements.lock in the same pull request.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Workflow actions are pinned to commit SHAs, which never float. Without this
  # they would simply go stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
