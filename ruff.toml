target-version = "py312"
line-length = 120
exclude = [".venv", "venv", "build", "dist", "__pycache__", "node_modules"]

[lint]
# Correctness and security rules only. Formatting and style are left to the author.
#   F   pyflakes: undefined names, unused imports and variables, shadowing
#   E9  syntax and IO errors that stop the file being parsed
#   B   bugbear: mutable defaults, loop-variable capture, silent exception loss
#   S   flake8-bandit: shell use, unchecked URL schemes, weak randomness,
#       temporary paths, swallowed exceptions, hard-coded secrets
select = ["F", "E9", "B", "S"]
# Rules that flag every subprocess call, PATH lookup or SQL string; why each is
# safe here is noted below. Mark any other false positive in S on its line with
# "# noqa: Sxxx - reason".
ignore = [
    # subprocess is always given an argument list and never a shell (S602 and
    # S605 stay on and have no hits).
    "S603",
    # docker/podman, git, systemctl, nvidia-smi and the like are found on PATH
    # on purpose: the services run with a fixed, administrator-owned PATH.
    "S607",
    # SQL is assembled from literal fragments, "?" placeholder lists and column
    # names checked against allowlists (EDITABLE_FIELDS, COLUMNS, ...); values
    # always go through ? parameters.
    "S608",
]

[lint.per-file-ignores]
# Package roots re-export their public API, so those imports are used by
# definition even though nothing in the file itself references them.
"__init__.py" = ["F401"]

# pytest fixtures look like unused or redefined imports; tamper tests assert that something fails; tests use
# assert, fixed passwords and local servers.
"tests/**" = ["F401", "F811", "B017", "S"]
"conftest.py" = ["F401", "S"]
# A browser test driver: assert is how it reports a failed check. Application
# code keeps S101, because python -O would remove an assert used as a guard.
"scripts/check_browser.py" = ["S101"]
