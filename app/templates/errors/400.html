<!DOCTYPE html>
<html lang="{{ current_language }}" data-theme="{{ effective_theme_mode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>400 | Bad Request</title>
  <link rel="stylesheet" href="/static/css/style.css">
  {% include "_theme_style.html" %}
</head>
<body>
<div class="error-page">
  <div class="error-card">
    <div class="error-code">400</div>
    <div class="error-title">Bad Request</div>
    <div class="error-msg">The server could not understand your request. Please check your input and try again.</div>
    <a href="/" class="btn btn-primary">Return Home</a>
  </div>
</div>
</body>
</html>
