name: Bug report
description: Report a reproducible bug in BananaChat.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, follow [SECURITY.md](https://github.com/BananaSuite/BananaChat/blob/main/SECURITY.md) instead.

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment type
      description: Where are you running BananaChat?
      options:
        - Managed single server
        - Managed web + compute
        - Manual install
        - Local development
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Source revision
      description: |
        Run `git rev-parse --short HEAD` in your source checkout, or
        `sudo bananachat status` for a managed installation.
        For a downloaded package, give its archive or release name.
      placeholder: "Commit hash or package name"
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: "3.12.7"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you saw, and any error message.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant excerpts from `journalctl -u bananachat`, the application log
        (`BC_LOG_FILE`, by default `bananachat.log` in the instance folder) or
        the browser console. Remove secrets, tokens and personal data before
        pasting.
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Browser, OS, reverse proxy, anything else.
    validations:
      required: false
