name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install backup encryption tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age
      - name: Verify shared backup sources
        run: python3 scripts/sync_backups.py --check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # The Markdown renderer's XSS regression tests run static/js/markdown.js
      # in Node. A pinned version, and BC_REQUIRE_NODE below makes a missing
      # Node fail the run instead of skipping them.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
      - name: Verify shared lifecycle sources
        run: python scripts/sync_lifecycle.py --check
      - name: Install (hash-pinned wheels only, as on a managed server)
        run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes --upgrade -r requirements-build.lock
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock
      - run: python -m pip install pytest ruff==0.17.1
      - name: Lint
        run: python -m ruff check .
      - run: python -m pytest -q
        env:
          BC_REQUIRE_NODE: "1"

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --only-binary=:all: --no-deps --upgrade 'pip>=26.2.1'
      - run: |
          python -m pip install --only-binary=:all: pip-audit
      - name: Install runtime environment
        run: |
          python -m venv "$RUNNER_TEMP/runtime-audit"
          runtime_python="$RUNNER_TEMP/runtime-audit/bin/python"
          "$runtime_python" -m pip install --only-binary=:all: --no-deps --require-hashes --upgrade -r requirements-build.lock
          "$runtime_python" -m pip install --only-binary=:all: --require-hashes -r requirements.lock
          "$runtime_python" -m pip check
      - name: Known vulnerabilities in runtime dependencies
        run: python -m pip_audit --path "$RUNNER_TEMP/runtime-audit/lib/python3.12/site-packages" --strict --progress-spinner off

  # The agent sandbox runner against a real Docker engine: no network, read-only
  # root, non-root user, memory/pids limits, timeouts, output caps, path
  # traversal, archives, reaper, capacity and authentication. Then the agent
  # image (compute/sandbox-image): Git under the sandbox flags, and a task
  # imported from a repository with its changes exported as a patch.
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Pull the sandbox image (Docker Hub mirror, avoids rate limits)
        run: docker pull mirror.gcr.io/library/python:3.12-slim
      - run: python -m pip install pytest
      - name: Sandbox runner tests
        env:
          BC_SANDBOX_REQUIRE_DOCKER: "1"
        run: python -m pytest -q tests/test_sandbox_runner.py tests/test_sandbox_runner_docker.py
      - name: Build the agent image
        run: docker build -t bananachat-agent:1 compute/sandbox-image
      - run: python -m pip install -r requirements.txt
      - name: Agent image tests (Git in the sandbox, repository import, patch export)
        env:
          BC_SANDBOX_REQUIRE_AGENT_IMAGE: "1"
        run: python -m pytest -q tests/app/test_agents_git_docker.py
      - name: Remove leftover sandboxes
        if: always()
        run: docker ps -aq --filter label=io.bananachat.sandbox=1 | xargs -r docker rm -f

  # The same runner tests on Podman, the default engine: its flags
  # (--read-only-tmpfs=false), `podman info` parsing and the shape of
  # `podman inspect` that the post-start verification reads (capabilities,
  # no-new-privileges, user). Podman runs as root here because hosted runners
  # have no systemd user session to delegate memory and pids limits to a
  # rootless engine; rootless Podman and gVisor still need the manual check in
  # docs/agents.md.
  sandbox-podman:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: podman --version
      - name: Pull the sandbox image into Podman's storage (Docker Hub mirror)
        run: sudo podman pull mirror.gcr.io/library/python:3.12-slim
      - run: python -m pip install pytest
      - name: Sandbox runner tests on Podman
        env:
          BC_SANDBOX_TEST_ENGINE: podman
          BC_SANDBOX_REQUIRE_DOCKER: "1"
        run: >-
          sudo --preserve-env=BC_SANDBOX_TEST_ENGINE,BC_SANDBOX_REQUIRE_DOCKER
          "$(command -v python)" -m pytest -q -p no:cacheprovider tests/test_sandbox_runner_docker.py
      - name: Remove leftover sandboxes
        if: always()
        run: sudo podman ps -aq --filter label=io.bananachat.sandbox=1 | xargs -r sudo podman rm -f

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --only-binary=:all: --no-deps --upgrade 'pip>=26.2.1'
      - run: python -m pip install -r requirements.txt -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - name: Check desktop and mobile chat
        run: python scripts/check_browser.py
      # Screenshots are only kept when the check fails, and a full artifact
      # storage quota must not turn a passing check red.
      - name: Retain browser results
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results
          path: .browser-artifacts/
          include-hidden-files: true
          retention-days: 7
